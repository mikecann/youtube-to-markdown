name: CI
on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build index.ts --target=bun --outdir="$RUNNER_TEMP/youtube-to-markdown-build"
      - run: bash -n install.sh youtube-to-markdown
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build index.ts --target=bun --outdir="$env:RUNNER_TEMP/youtube-to-markdown-build"
      - run: pwsh -NoProfile -File tests/check-powershell.ps1
